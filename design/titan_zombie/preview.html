const ids=Object.fromEntries(bones.map(b=>[b.name,b]));
function sample(channel,t){if(!channel)return [0,0,0];if(Array.isArray(channel))return channel;const keys=Object.keys(channel).map(Number).sort((a,b)=>a-b);let a=keys[0],b=keys.at(-1);if(t<=a)return channel[a];if(t>=b)return channel[b];for(let i=0;i<keys.length-1;i++)if(t>=keys[i]&&t<=keys[i+1]){a=keys[i];b=keys[i+1];break}let f=(t-a)/(b-a);return channel[a].map((v,i)=>v+(channel[b][i]-v)*f)}
function rotate(v,r){let [x,y,z]=v;const [rx,ry,rz]=r.map(n=>n*Math.PI/180);let c=Math.cos(rx),s=Math.sin(rx);[y,z]=[y*c-z*s,y*s+z*c];c=Math.cos(ry);s=Math.sin(ry);[x,z]=[x*c+z*s,-x*s+z*c];c=Math.cos(rz);s=Math.sin(rz);return [x*c-y*s,x*s+y*c,z]}
function transform(v,b,a,t){const ch=a.bones[b.name]||{};let r=sample(ch.rotation||b.rotation,t),p=sample(ch.position,t);let q=rotate(v.map((n,i)=>n-b.pivot[i]),r).map((n,i)=>n+b.pivot[i]+p[i]);return b.parent?transform(q,ids[b.parent],a,t):q}
function camera(v){let [x,y,z]=v;y-=256;const c=Math.cos(yaw),s=Math.sin(yaw);[x,z]=[x*c-z*s,x*s+z*c];const cp=Math.cos(pitch),sp=Math.sin(pitch);return [x,y*cp-z*sp,y*sp+z*cp]}
let w=0,h=0,scale=1;
function screen(v){return [w*.5+v[0]*scale,h*.56-v[1]*scale]}
const indices={north:[0,1,2,3],south:[5,4,7,6],west:[4,0,3,7],east:[1,5,6,2],up:[3,2,6,7],down:[4,5,1,0]};
function corners(c,infl){let [x,y,z]=c.origin,[a,b,d]=c.size;x-=infl;y-=infl;z-=infl;a+=2*infl;b+=2*infl;d+=2*infl;return [[x,y,z],[x+a,y,z],[x+a,y+b,z],[x,y+b,z],[x,y,z+d],[x+a,y,z+d],[x+a,y+b,z+d],[x,y+b,z+d]]}

function render(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!paused)time+=dt;let a=animations['animation.titan_zombie.'+mode],t=a.loop?time%a.animation_length:Math.min(time,a.animation_length);if(mode==='attack'&&time>a.animation_length+.35){mode='idle';time=0;buttons.forEach(b=>b.classList.toggle('active',b.dataset.a===mode));a=animations['animation.titan_zombie.idle'];t=0}

 const vs=corners(c,armor?3:0).map(v=>camera(transform(v,b,a,t)));
 for(const [face,ind]of Object.entries(indices)){let vv=ind.map(i=>vs[i]);let p0=vv[0],p1=vv[1],p2=vv[2];const nx=(p1[1]-p0[1])*(p2[2]-p0[2])-(p1[2]-p0[2])*(p2[1]-p0[1]),ny=(p1[2]-p0[2])*(p2[0]-p0[0])-(p1[0]-p0[0])*(p2[2]-p0[2]),nz=(p1[0]-p0[0])*(p2[1]-p0[1])-(p1[1]-p0[1])*(p2[0]-p0[0]);if(nz<=0)continue;let len=Math.hypot(nx,ny,nz);let shade=.65+.35*Math.max(0,(-nx*.4-ny*.8+nz*.5)/len);fs.push({vv,uv:c.uv[face],armor,shade,depth:vv.reduce((s,v)=>s+v[2],0)/4});}}
 fs.sort((a,b)=>b.depth-a.depth);for(const f of fs){let vv=f.vv;if(f.armor){poly(vv.map(screen),'#61ff66',.3);continue}let [tx,ty]=f.uv.uv,[tw,th]=f.uv.uv_size;vv=[vv[3],vv[2],vv[1],vv[0]];const point=(x,y)=>screen([0,1,2].map(i=>vv[0][i]*(1-x)*(1-y)+vv[1][i]*x*(1-y)+vv[2][i]*x*y+vv[3][i]*(1-x)*y));for(let y=0;y<th;y++)for(let x=0;x<tw;x++){let pos=((ty+y)*256+tx+x)*4;let rgb=pixels.slice(pos,pos+3).map(v=>Math.min(255,Math.round(v*f.shade)));poly([point(x/tw,y/th),point((x+1)/tw,y/th),point((x+1)/tw,(y+1)/th),point(x/tw,(y+1)/th)],`rgb(${rgb})`)} }

const buttons=[...document.querySelectorAll('[data-a]')];buttons.forEach(b=>b.onclick=()=>{mode=b.dataset.a;time=0;buttons.forEach(q=>q.classList.toggle('active',q===b))});document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续':'暂停'};let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-.7,Math.min(.7,pitch+(e.clientY-drag[1])*.004));drag=[e.clientX,e.clientY]};canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.55,Math.min(1.7,zoom-e.deltaY*.001))};requestAnimationFrame(render);
