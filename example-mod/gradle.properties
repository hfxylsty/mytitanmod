org.gradle.jvmargs=-Xmx2G -Djava.io.tmpdir=E:/titanmod/.tmp
org.gradle.daemon=false
# 打开 NeoForm 详细日志，否则 NeoForm 会吞掉 javac 的真实报错（见 ENVIRONMENT.md）
neoForge.neoFormRuntime.verbose=true
# true = 用 NeoForm 自带的 ECJ，绕开工作区内 JDK 的 zipfs 只读问题（见 ENVIRONMENT.md 第六节）
neoForge.neoFormRuntime.useEclipseCompiler=true
