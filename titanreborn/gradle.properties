org.gradle.jvmargs=-Xmx3G -Djava.io.tmpdir=E:/titanmod/.tmp
org.gradle.daemon=false
# NeoForm 详细日志：不加这个，NeoForm 会把 javac 的真实报错吞成一行 "null"（见 docs/20-environment.md）
neoForge.neoFormRuntime.verbose=true
# 改用 NeoForm 自带的 ECJ，绕开工作区内 JDK 的 zipfs 只读问题（见 docs/20-environment.md §4）
neoForge.neoFormRuntime.useEclipseCompiler=true
